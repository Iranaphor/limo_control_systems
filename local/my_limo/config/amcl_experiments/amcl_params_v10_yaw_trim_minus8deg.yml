amcl:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    tf_broadcast: true
    transform_tolerance: 0.2

    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.09
    alpha2: 0.02
    alpha3: 0.03
    alpha4: 0.06
    alpha5: 0.2

    laser_model_type: "likelihood_field"
    laser_max_range: -1.0
    laser_min_range: -1.0
    max_beams: 220
    sigma_hit: 0.07
    laser_likelihood_max_dist: 0.15
    z_hit: 0.96
    z_rand: 0.04
    do_beamskip: false

    min_particles: 300
    max_particles: 1500
    pf_err: 0.03
    pf_z: 0.99
    resample_interval: 1

    update_min_d: 0.008
    update_min_a: 0.06

    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    scan_topic: scan
    map_topic: keepout_mask

    set_initial_pose: true
    always_reset_initial_pose: false
    first_map_only: false

    initial_pose:
      x: 2.55
      y: -0.26
      z: 0.0
      yaw: 2.92

    save_pose_rate: 0.5
