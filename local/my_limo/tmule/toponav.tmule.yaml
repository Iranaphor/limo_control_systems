---
session: my_limo
init_cmd: |
  exec /bin/bash
  cd @TMULE_CONFIG_DIR@ || true
  set -o pipefail
  #export NAV2_PARAMS="$HOME/ros2_ws/src/external/limo_platform/src/limo_ros2/src/limo_navigation/params/nav2_params.yaml"
  export NAV2_PARAMS="$HOME/ros2_ws/src/local/my_limo/config/nav2_params.yml"

windows:

# - name: vrviz_broker
