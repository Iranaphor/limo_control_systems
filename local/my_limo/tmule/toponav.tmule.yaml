# - name: limo_bringup
#   panes:
#   - ros2 launch limo_bringup limo_start.launch.py
#   - ros2 run my_limo mqtt.py

- name: limo_control
  panes:
  - ros2 launch teleop_twist_joy teleop-launch.py joy_dev:=$JOY_DEV_ID config_filepath:=$JOY_CONFIG
#  - sleep 5 ; ros2 topic echo /joy
  - ros2 run teleop_twist_keyboard teleop_twist_keyboard

- name: environment
  panes:
  - ros2 launch environment_common environment.launch.py
  - ros2 topic echo /map nav_msgs/msg/OccupancyGrid --once --no-arr --qos-reliability reliable --qos-durability transient_local
#  check: "ros2 topic echo /map nav_msgs/msg/OccupancyGrid --once --no-arr --qos-reliability reliable --qos-durability transient_local"

- name: map_loc
  panes:
  - ros2 launch my_limo localisation.launch.py
  - ros2 run rqt_tf_tree rqt_tf_tree

- name: map_nav
  panes:
  - DISPLAY=:1 ; ros2 launch limo_navigation limo_controller.launch.py params_file:=$NAV2_PARAMS

