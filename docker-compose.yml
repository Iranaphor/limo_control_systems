services:
  # ---------------------------------------------------------------------------
  # limo_platform services (from external/limo_platform/configs/docker-compose.yaml)
  # ---------------------------------------------------------------------------
  filebrowser:
    image: filebrowser/filebrowser
    pull_policy: always
    networks:
      - rosnet
    ports:
      - 8080:8080
    volumes:
      - ${HOME}:/srv
    command: -r /srv --noauth -b "${HOME}" -d /tmp/database.db -p 8080 --disable-exec

#  zenoh_router:
#    image: eclipse/zenoh-bridge-ros2dds:latest
#    pull_policy: always
#    networks:
#      - rosnet
#    ports:
#      - 7447:7447
#      - 8000:8000
#    command: "-c /etc/zenoh/zenoh.json5 router"
#    volumes:
#      - /etc/localtime:/etc/localtime:ro
#      - /etc/timezone:/etc/timezone:ro
#      - ./external/limo_platform/configs/zenoh.json5:/etc/zenoh/zenoh.json5:ro
#    links:
#      - limo_drivers
#    environment:
#      - ROS_DISTRO=humble

  limo_drivers:
    image: lcas.lincoln.ac.uk/lcas/limo_platform:2
    pull_policy: always
    user: "ros"
    ports:
      - 5801:5801
      - 5901:5901
      - 9999:9999
    hostname: "${ROBOT_NAME}"
    privileged: true
    ipc: host
    # Original command extended with localization and navigation controller.
    # limo_start is backgrounded so localization + controller can start after it.
    command: >-
      bash -c "
        source /opt/ros/lcas/install/setup.bash;
        echo \$$CYCLONEDDS_URI;
        (code-server --auth none -an ${ROBOT_NAME} --bind-addr 0.0.0.0:9999 --cert &);
        ros2 launch limo_bringup limo_start.launch.py
      "
    volumes:
      - /dev:/dev
      - ${HOME}:/home/ros/robot_home
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    runtime: nvidia
    shm_size: '2gb'
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - MAP_YAML_FILE=${MAP_YAML_FILE:-}
    networks:
      - rosnet
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ---------------------------------------------------------------------------
  # Research / development container
  # ---------------------------------------------------------------------------
  limo_research:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: never
    image: limo_control_systems:latest
    container_name: limo_research
    hostname: limo_research
    stdin_open: true
    tty: true
    ipc: host
    networks:
      - rosnet
    privileged: true
    devices:
      - /dev/input:/dev/input
    volumes:
      - ./external:/home/ros/ros2_ws/src/external:rw
      - ./local:/home/ros/ros2_ws/src/local:rw
      - ./start.sh:/home/ros/start.sh:rw
      - ./bash_aliases.sh:/home/ros/.bash_aliases:rw
      - ./tmux.conf:/home/ros/.tmux.conf:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /run/udev:/run/udev:ro
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-35}
      - TMULE_FILE=${TMULE_FILE:-}
      - LAUNCH_CMD=${LAUNCH_CMD:-}
      - SLEEP_TIME=${SLEEP_TIME:-infinity}
      - MARKER_FILE=/home/ros/.colcon/.first_run_done
      - SDL_JOYSTICK_DEVICE=/dev/input/js0
    command: ["bash", "-l", "-c", "/home/ros/start.sh"]


  topfleets_agent:
    build:
      context: ../topfleets_agent
      dockerfile: docker/Dockerfile
      args:
        - ZENOH_BRIDGE_VERSION=1.5.0
        - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    container_name: topfleets_agent
    hostname: topfleets_agent
    ipc: host
    networks:
      - rosnet
    tty: true
    stdin_open: true
    volumes:
      # Mount helper scripts
      - ../topfleets_agent/bash_scripts/container:/home/ros/bash_scripts:rw
      # Mount ROS2 packages
      - ../topfleets_agent/topfleets_agent_ros2:/home/ros/ros2_ws/src/topfleets_agent:rw
      - ../topfleets_agent/topfleets_msgs:/home/ros/ros2_ws/src/topfleets_msgs:rw
      - ../topfleets_agent/topological_navigation/topological_navigation_msgs:/home/ros/ros2_ws/src/toplogical_navigation_msgs:rw
    environment:
      # Define details of agent
      - AGENT_ID=LM001535
      - AGENT_CONFIGURATION=/home/ros/ros2_ws/src/topfleets_agent/config/agent/agilex_limo.yaml
      # Define details of communication
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-35}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ZENOH_TCP_REMOTE=tcp/10.247.72.13:7447
      - ZENOH_COORDINATION_CONF=/home/ros/ros2_ws/src/topfleets_agent/config/zenoh/topics.json5
      - ZENOH_COORDINATION_NS_CONF=/home/ros/ros2_ws/src/topfleets_agent/config/zenoh/topics_ns.json5
      - MQTT_IP='localhost'
      - MQTT_PORT=${MQTT_PORT}                # i.e. 1883
    command: ["bash", "-l", "-c", "/home/ros/bash_scripts/start.sh"]

volumes:
  colcon_cache:

networks:
  rosnet:
    driver: bridge
    driver_opts:
      com.docker.network.container_iface_prefix: eth



